<div class="settings-card">
  <div class="settings-card__header">
    <div class="settings-card__icon-wrap">
      <ion-icon name="person-outline"></ion-icon>
    </div>
    <span class="settings-card__title">{{ 'PROFILE.TITLE' | translate }}</span>
  </div>

  <form (ngSubmit)="onSubmit()" [formGroup]="profileForm" class="settings-form">
    <div class="form-field">
      <label class="form-field__label">{{ 'PROFILE.NAME' | translate }}</label>
      <input class="form-field__input" formControlName="name" type="text" [placeholder]="'PROFILE.NAME' | translate">
    </div>

    <div class="form-field">
      <label class="form-field__label">{{ 'PROFILE.EMAIL' | translate }}</label>
      <input class="form-field__input" formControlName="email" type="email" [placeholder]="'PROFILE.EMAIL' | translate" readonly>
    </div>

    <ion-button [disabled]="profileForm.invalid" expand="block" type="submit" class="save-btn">{{ 'PROFILE.SAVE' | translate }}</ion-button>
  </form>
</div>
